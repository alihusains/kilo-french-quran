version: '3.8'
services:
  admin:
    build: .
    ports:
      - "5001:5001"
    environment:
      - DATABASE_PATH=/data/oc_frenchquran.sqlite
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
    volumes:
      - ../oc_frenchquran.sqlite:/data/oc_frenchquran.sqlite
    restart: unless-stopped
