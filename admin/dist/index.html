<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Admin — Tafsir Management</title>
  <meta name="description" content="Admin panel for Quran tafsir management">

  <!-- Google Fonts - Poppins for UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    @font-face {
      font-family: 'AlQalamQuranMajeed';
      src: url('./fonts/AlQalamQuranMajeed2.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">

  <style>
    /* === Design System - Dark OLED Theme === */
    :root {
      --color-bg: #0a0a0f;
      --color-bg-soft: #0d0d14;
      --color-bg-card: #12121a;
      --color-bg-card-hover: #1a1a26;
      --color-text: #e4e4ec;
      --color-text-muted: #8a8a9a;
      --color-primary: #22c55e;
      --color-primary-hover: #16a34a;
      --color-primary-soft: rgba(34, 197, 94, 0.15);
      --color-accent: #d4af37;
      --color-accent-soft: rgba(212, 175, 55, 0.12);
      --color-danger: #ef4444;
      --color-danger-soft: rgba(239, 68, 68, 0.12);
      --color-info: #60a5fa;
      --color-info-soft: rgba(96, 165, 250, 0.12);
      --color-border: #24242f;
      --color-input-bg: #16161f;
      --color-surface: #0d0d14;

      --font-display: 'AlQalamQuranMajeed', sans-serif;
      --font-body: 'Poppins', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --spacing-xs: 0.35rem;
      --spacing-sm: 0.5rem;
      --spacing-md: 1rem;
      --spacing-lg: 1.5rem;
      --spacing-xl: 2rem;

      --radius-sm: 0.375rem;
      --radius-md: 0.625rem;
      --radius-lg: 0.875rem;

      --shadow-sm: 0 1px 2px rgba(0,0,0,0.35);
      --shadow-md: 0 4px 14px rgba(0,0,0,0.45);
      --shadow-lg: 0 12px 28px rgba(0,0,0,0.55);
    }

    * { box-sizing: border-box; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: var(--font-body);
      background:
        radial-gradient(1200px 500px at 80% -10%, rgba(212, 175, 55, 0.07), transparent 60%),
        radial-gradient(900px 400px at 0% 0%, rgba(34, 197, 94, 0.06), transparent 55%),
        var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      line-height: 1.65;
    }

    .arabic { font-family: var(--font-display); direction: rtl; unicode-bidi: embed; }

    .container { max-width: 1200px; margin: 0 auto; padding: var(--spacing-md); }

    /* === Header === */
    header {
      background: linear-gradient(180deg, rgba(18,18,26,0.92), rgba(10,10,15,0.92));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: white;
      padding: var(--spacing-md) var(--spacing-lg);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--color-border);
      box-shadow: var(--shadow-sm);
    }

    header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: var(--spacing-md);
      padding: 0;
      max-width: 1200px;
    }

    .brand { display: flex; align-items: center; gap: 0.65rem; }
    .brand-icon {
      width: 38px; height: 38px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--color-primary), #059669);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 0 18px rgba(34, 197, 94, 0.35);
      flex-shrink: 0;
    }
    header h1 {
      font-family: var(--font-body);
      font-size: 1.1rem;
      font-weight: 600;
      margin: 0;
      letter-spacing: 0.2px;
    }
    header .subtitle { font-size: 0.7rem; color: var(--color-text-muted); font-weight: 400; }

    header nav { display: flex; gap: 0.25rem; }
    header nav a {
      color: var(--color-text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 0.5rem 0.9rem;
      border-radius: var(--radius-md);
      transition: all 0.2s ease;
      display: inline-flex; align-items: center; gap: 0.4rem;
    }
    header nav a:hover { background: var(--color-bg-card-hover); color: var(--color-text); }
    header nav a.active { background: var(--color-primary-soft); color: var(--color-primary); }
    header nav a.nav-logout:hover { background: var(--color-danger-soft); color: var(--color-danger); }

    /* === Cards === */
    .card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      padding: var(--spacing-lg);
      margin-bottom: var(--spacing-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--color-border);
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #2e2e3c;
    }
    .card.flat:hover { transform: none; }

    .card-header {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 var(--spacing-md) 0;
      color: var(--color-text);
      letter-spacing: -0.3px;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .card-header .count-chip {
      font-size: 0.75rem; font-weight: 600;
      background: var(--color-bg-card-hover);
      color: var(--color-text-muted);
      border: 1px solid var(--color-border);
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      letter-spacing: 0;
    }

    /* === Alerts / Toasts === */
    #alerts { position: fixed; top: 76px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 380px; }
    .toast {
      padding: 0.8rem 1rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      animation: toastIn 0.25s ease-out;
      font-size: 0.9rem;
      border: 1px solid;
      backdrop-filter: blur(8px);
      display: flex; align-items: center; gap: 0.6rem;
    }
    .toast.hide { animation: toastOut 0.25s ease-in forwards; }
    .toast-success { background: rgba(6, 32, 16, 0.95); color: #4ade80; border-color: rgba(34, 197, 94, 0.4); }
    .toast-error { background: rgba(40, 8, 12, 0.95); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }
    .toast-info { background: rgba(8, 20, 40, 0.95); color: #60a5fa; border-color: rgba(96, 165, 250, 0.4); }

    @keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes toastOut { from { opacity: 1; } to { opacity: 0; transform: translateX(20px); } }

    /* === Buttons === */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.45rem;
      padding: 0.55rem 1.1rem;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      font-family: inherit;
      transition: all 0.18s ease;
      line-height: 1.4;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; pointer-events: none; }
    .btn-primary { background: var(--color-primary); color: #052e14; font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: var(--color-primary-hover); transform: translateY(-1px); box-shadow: 0 0 16px rgba(34, 197, 94, 0.35); }
    .btn-danger { background: var(--color-danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; transform: translateY(-1px); box-shadow: 0 0 16px rgba(239, 68, 68, 0.3); }
    .btn-secondary { background: var(--color-bg-card-hover); color: var(--color-text); border-color: var(--color-border); }
    .btn-secondary:hover:not(:disabled) { background: #232330; }
    .btn-ghost { background: transparent; color: var(--color-text-muted); }
    .btn-ghost:hover:not(:disabled) { background: var(--color-bg-card-hover); color: var(--color-text); }
    .btn-outline-danger { background: transparent; color: var(--color-danger); border-color: rgba(239, 68, 68, 0.4); }
    .btn-outline-danger:hover:not(:disabled) { background: var(--color-danger-soft); }
    .btn-sm { padding: 0.32rem 0.7rem; font-size: 0.8rem; border-radius: var(--radius-sm); }
    .btn-lg { padding: 0.7rem 1.5rem; font-size: 0.95rem; }
    .btn-block { width: 100%; }

    .icon-btn {
      width: 32px; height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: var(--radius-sm);
      border: 1px solid var(--color-border);
      background: var(--color-bg-card-hover);
      color: var(--color-text-muted);
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.9rem;
    }
    .icon-btn:hover { color: var(--color-text); border-color: #3a3a4a; }
    .icon-btn.edit:hover { color: var(--color-primary); border-color: rgba(34,197,94,0.5); background: var(--color-primary-soft); }
    .icon-btn.del:hover { color: var(--color-danger); border-color: rgba(239,68,68,0.5); background: var(--color-danger-soft); }

    /* === Forms === */
    .form-group { margin-bottom: var(--spacing-md); }
    label { display: block; font-weight: 500; margin-bottom: 0.4rem; color: var(--color-text); font-size: 0.88rem; }
    input, select, textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.92rem;
      background: var(--color-input-bg);
      color: var(--color-text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
    }
    textarea { min-height: 120px; resize: vertical; line-height: 1.7; }

    .search-wrapper { position: relative; }
    .search-wrapper input { padding-left: 2.2rem; }
    .search-wrapper .search-icon {
      position: absolute; left: 0.8rem; top: 50%; transform: translateY(-50%);
      color: var(--color-text-muted); font-size: 0.9rem; pointer-events: none;
    }

    /* === WYSIWYG === */
    .wysiwyg-wrapper {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      background: var(--color-input-bg);
    }
    .ql-toolbar {
      border-radius: var(--radius-md) var(--radius-md) 0 0 !important;
      border: none !important;
      border-bottom: 1px solid var(--color-border) !important;
      background: var(--color-bg-card);
    }
    .ql-container {
      border: none !important;
      font-family: var(--font-body);
      font-size: 0.95rem;
      background: var(--color-input-bg);
    }
    .ql-editor {
      min-height: 200px;
      direction: rtl;
      text-align: right;
      line-height: 2;
      color: var(--color-text);
    }
    .ql-editor.ql-blank::before { color: var(--color-text-muted); font-style: normal; }
    .ql-toolbar button { color: var(--color-text) !important; }
    .ql-toolbar button:hover { color: var(--color-primary) !important; }
    .ql-toolbar .ql-stroke { stroke: currentColor !important; }
    .ql-toolbar .ql-fill { fill: currentColor !important; }
    .ql-picker-label, .ql-picker-options { color: var(--color-text) !important; background: var(--color-bg-card) !important; }
    .ql-picker-options { border: 1px solid var(--color-border) !important; }
    .ql-editor strong { color: var(--color-accent); }

    /* === Badges === */
    .badge {
      display: inline-block;
      padding: 0.22rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .badge-meccan { background: var(--color-primary-soft); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .badge-medinan { background: var(--color-danger-soft); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .badge-neutral { background: var(--color-bg-card-hover); color: var(--color-text-muted); border: 1px solid var(--color-border); }
    .badge-gold { background: var(--color-accent-soft); color: var(--color-accent); border: 1px solid rgba(212,175,55,0.3); }

    /* === Accordions === */
    .accordion { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; margin-bottom: 0.6rem; background: var(--color-bg-card); }
    .accordion-header {
      background: var(--color-bg-card);
      padding: 0.8rem 1rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      font-weight: 500;
      border: none;
      width: 100%;
      text-align: left;
      color: var(--color-text);
      font-family: inherit;
      font-size: 0.92rem;
      transition: background 0.15s ease;
    }
    .accordion-header:hover { background: var(--color-bg-card-hover); }
    .accordion-header i { transition: transform 0.25s ease; color: var(--color-text-muted); flex-shrink: 0; }
    .accordion-header[aria-expanded="true"] i { transform: rotate(180deg); }
    .accordion-body { padding: 1rem; display: none; background: var(--color-bg-soft); border-top: 1px solid var(--color-border); }
    .accordion-body.open { display: block; animation: fadeSlide 0.2s ease-out; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .verse-chip {
      min-width: 44px; height: 30px;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: var(--radius-sm);
      font-weight: 600; font-size: 0.82rem;
      flex-shrink: 0;
    }

    /* === Loading & Empty === */
    .loading, .empty-state { text-align: center; padding: var(--spacing-xl); color: var(--color-text-muted); }
    .spinner {
      display: inline-block; width: 22px; height: 22px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-icon { font-size: 2.8rem; margin-bottom: var(--spacing-sm); opacity: 0.45; filter: grayscale(0.3); }
    .empty-state h3 { color: var(--color-text); font-weight: 600; margin: 0 0 0.25rem; }

    /* === Grid === */
    .grid { display: grid; gap: var(--spacing-md); }
    @media (min-width: 768px) { .grid-2 { grid-template-columns: repeat(2, 1fr); } .grid-3 { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { .grid-4 { grid-template-columns: repeat(4, 1fr); } }

    /* === Auth === */
    .login-container { max-width: 420px; margin: 4rem auto; }
    .auth-card {
      background: var(--color-bg-card);
      border-radius: var(--radius-lg);
      padding: var(--spacing-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
    }
    .auth-card .logo-circle {
      width: 64px; height: 64px; margin: 0 auto 1rem;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--color-primary), #059669);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.35);
    }
    .auth-sub { text-align: center; color: var(--color-text-muted); font-size: 0.85rem; margin: -0.4rem 0 1.2rem; }

    /* === Surah cards === */
    .surah-card { cursor: pointer; position: relative; overflow: hidden; }
    .surah-card::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(300px 120px at 90% 0%, rgba(212,175,55,0.08), transparent 70%);
      pointer-events: none;
    }
    .surah-card .surah-num {
      width: 40px; height: 40px; border-radius: var(--radius-md);
      background: var(--color-accent-soft);
      color: var(--color-accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
      border: 1px solid rgba(212,175,55,0.25);
      flex-shrink: 0;
    }
    .surah-card .arabic-name { font-size: 1.45rem; margin-top: 0.35rem; color: var(--color-accent); opacity: 0.9; }
    .surah-card:hover .arabic-name { opacity: 1; }

    /* === Tafsir section cards === */
    .tafsir-section-card { transition: border-color 0.3s ease, box-shadow 0.3s ease; }
    .tafsir-section-card.saved { border-left: 4px solid var(--color-success) !important; background: rgba(34, 197, 94, 0.03); }
    .tafsir-section-card.empty { border-left: 4px solid var(--color-border) !important; }
    .save-section-btn.saving { opacity: 0.7; pointer-events: none; }
    .save-section-btn.saved { background: var(--color-success) !important; border-color: var(--color-success) !important; color: #052e14 !important; }

    .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--color-border); vertical-align: middle; transition: background 0.3s; }
    .dot.filled { background: var(--color-primary); box-shadow: 0 0 6px rgba(34,197,94,0.6); }

    .save-status { font-size: 0.72rem; font-weight: 600; padding: 0.15rem 0.55rem; border-radius: 999px; }
    .save-status.badge-success { background: var(--color-primary-soft); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .save-status.badge-info { background: var(--color-info-soft); color: var(--color-info); border: 1px solid rgba(96,165,250,0.25); }

    #surah-info-bar, #section-progress-bar {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 0.6rem 1rem;
      margin-bottom: var(--spacing-md);
      font-size: 0.85rem;
      color: var(--color-text-muted);
      display: none;
    }
    #surah-info-bar { color: var(--color-accent); border-left: 3px solid var(--color-accent); }

    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }

    /* === Modal === */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center; justify-content: center;
      padding: 1rem;
    }
    .modal-backdrop.show { display: flex; animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 1.6rem;
      max-width: 420px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      animation: modalUp 0.22s ease-out;
    }
    @keyframes modalUp { from { opacity: 0; transform: translateY(12px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal h3 { margin: 0 0 0.5rem; font-size: 1.15rem; }
    .modal p { color: var(--color-text-muted); font-size: 0.9rem; margin: 0 0 1.2rem; }
    .modal-actions { display: flex; gap: 0.6rem; justify-content: flex-end; }

    /* === Tafsir list items === */
    .tafsir-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; padding: 0.85rem 0; border-top: 1px solid var(--color-border); }
    .tafsir-item:first-of-type { border-top: none; padding-top: 0.25rem; }
    .tafsir-item .section-title { font-weight: 600; font-size: 0.92rem; color: var(--color-accent); }
    .tafsir-item .content-preview { font-size: 0.85rem; color: var(--color-text-muted); margin-top: 0.3rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

    .verse-text { font-size: 1.05rem; line-height: 2.2; }
    .translation-text { color: var(--color-text-muted); font-size: 0.92rem; }

    .section-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }

    footer {
      text-align: center; padding: 2rem 1rem 1.5rem;
      color: var(--color-text-muted); font-size: 0.75rem;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      header .container { flex-direction: column; text-align: center; gap: 0.5rem; }
      header nav a { font-size: 0.8rem; padding: 0.4rem 0.7rem; }
      .card { padding: var(--spacing-md); }
      #alerts { left: 16px; right: 16px; max-width: none; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar .search-wrapper { flex: 1 !important; width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Hidden elements for JS views -->
  <header id="app-header" style="display: none;">
    <div class="container">
      <div class="brand">
        <div class="brand-icon">📖</div>
        <div>
          <h1>Quran Admin <span class="arabic" style="color: var(--color-accent); font-size: 0.95rem;">القرآن الكريم</span></h1>
          <div class="subtitle">French Quran · Tafsir Management</div>
        </div>
      </div>
      <nav>
        <a href="#" data-nav="surahs" id="nav-surahs"><i class="bi bi-book"></i> Surahs</a>
        <a href="#" data-nav="tafsir" id="nav-tafsir"><i class="bi bi-journal-text"></i> Tafsir</a>
        <a href="#" data-nav="logout" class="nav-logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </nav>
    </div>
  </header>

  <div class="container">
    <div id="alerts"></div>

    <!-- Login View -->
    <div id="login-view" class="login-container">

        <h2 class="card-header" style="margin:0 0 0.25rem; text-align:center; justify-content:center;">Admin Login</h2>

        <h2 class="card-header" style="margin:0;" id="verse-form-title">Edit Verse</h2>
      </div>
      <div class="auth-card" style="max-width: 800px; margin-top: 0.5rem;">
        <form id="verse-form">
          <div class="form-group">
            <label for="verse-ar">Arabic Text</label>
            <textarea id="verse-ar" dir="rtl" rows="3" placeholder="Enter Arabic text..."></textarea>
          </div>
          <div class="form-group">
            <label for="verse-fr">French Translation</label>
            <textarea id="verse-fr" rows="4" placeholder="Enter French translation..."></textarea>
          </div>

            <label for="verse-audio-url">Audio URL</label>
            <input type="text" id="verse-audio-url" placeholder="https://...">

            <label for="verse-audio-fr">Audio French Translation</label>
            <input type="text" id="verse-audio-fr" placeholder="Audio title...">
          </div>

            <label for="verse-audio-tafsir">Audio Tafsir</label>

  <!-- Confirm Modal -->
  <div class="modal-backdrop" id="confirm-modal">
    <div class="modal">
      <h3 id="confirm-title">Confirm</h3>
      <p id="confirm-message">Are you sure?</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="confirm-ok"><i class="bi bi-trash"></i> Delete</button>
      </div>
    </div>
  </div>

  <footer>French Quran · Tafsir Admin — powered by Supabase</footer>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>

  <!-- Main JavaScript -->
  <script type="module">
    // Import Supabase client
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    // Configuration - In production, these should be in environment variables
    const CONFIG = {
      SUPABASE_URL: 'https://ayyfeobcubwoasrshhbg.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_CmQP2Ir7vqQu40j9WUHn-w_95NqUUKS',
      ADMIN_PASSWORD: 'admin123'
    }

    const db = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)

    const app = {
      currentView: 'login',
      editingTafsirId: null,
      editingVerseId: null,
      verseSuraId: null,
      verses: [],
      surahs: [],
      tafsirCache: [],
      sectionEditors: new Map(),
      allSections: [],
      _renderPromise: null,
      _editToken: 0,
      _confirmCallback: null,

      /**
       * Initialize the application
       */
      init() {
        this.restoreAuthState()
        this.bindEvents()
        this.route()
      },

      /**
       * Restore authentication state from localStorage
       */
      restoreAuthState() {
        if (localStorage.getItem('logged_in') === '1') {
          this.showView('surahs')
          this.loadSurahs()
        }
      },

      /**
       * Bind all event listeners
       */
      bindEvents() {
        // Login form
        document.getElementById('login-form')?.addEventListener('submit', e => {
          e.preventDefault()
          this.login()
        })

        // Navigation
        document.getElementById('app-header')?.querySelector('nav')?.addEventListener('click', e => {
          const nav = e.target.closest('a[data-nav]')
          if (!nav) return
          e.preventDefault()
          const action = nav.getAttribute('data-nav')
          if (action === 'surahs') this.navigate('surahs')
          else if (action === 'tafsir') this.navigate('tafsir')
          else if (action === 'logout') this.logout()
        })

        // Tafsir surah select
        document.getElementById('tafsir-sura-id')?.addEventListener('change', async () => {
          this.renderTafsirSections()
        })

        // Save all tafsir
        document.getElementById('btn-save-all-tafsir')?.addEventListener('click', async () => {
          const btn = document.getElementById('btn-save-all-tafsir')
          if (!btn) return
          btn.disabled = true
          btn.innerHTML = '<span class="spinner"></span> Saving...'
          await this.saveAllTafsir()
          btn.disabled = false
          btn.innerHTML = '<i class="bi bi-check2-all"></i> Save All Sections'
        })

        // Verse form
        document.getElementById('verse-form')?.addEventListener('submit', e => {
          e.preventDefault()
          this.saveVerse()
        })

        // Search handlers
        document.getElementById('surah-search')?.addEventListener('input', () => this.renderSurahs())
        document.getElementById('tafsir-search')?.addEventListener('input', () => this.renderTafsir())

        // Cancel buttons
        document.getElementById('btn-cancel-tafsir')?.addEventListener('click', () => this.navigate('tafsir'))
        document.getElementById('btn-cancel-verse')?.addEventListener('click', () => this.backFromVerse())

        // Back buttons
        document.getElementById('btn-back-surah')?.addEventListener('click', () => {
          location.hash = ''
          this.showView('surahs')
          this.loadSurahs()
        })
        document.getElementById('btn-back-tafsir')?.addEventListener('click', () => this.navigate('tafsir'))
        document.getElementById('btn-back-verse')?.addEventListener('click', () => this.backFromVerse())

        // Confirm modal
        document.getElementById('confirm-cancel')?.addEventListener('click', () => this.closeConfirm())
        document.getElementById('confirm-modal')?.addEventListener('click', e => {
          if (e.target === e.currentTarget) this.closeConfirm()
        })
        document.getElementById('confirm-ok')?.addEventListener('click', async () => {
          const cb = this._confirmCallback
          this.closeConfirm()
          if (cb) await cb()
        })

        // Central click delegation
        document.body?.addEventListener('click', async e => {
          const btn = e.target.closest('[data-action]')
          if (!btn) return
          const action = btn.getAttribute('data-action')
          if (action === 'toggle-accordion') {
            const body = btn.nextElementSibling
            if (body) {
              const isOpen = body.classList.toggle('open')
              btn.setAttribute('aria-expanded', isOpen)
            }
          } else if (action === 'open-surah') {
            const suraId = parseInt(btn.getAttribute('data-id'))
            if (suraId) {
              location.hash = 'surah/' + suraId
              this.showSurahDetail(suraId)
            }
          } else if (action === 'edit-verse') {
            const ayatId = parseInt(btn.getAttribute('data-id'))
            this.editVerse(ayatId)
          } else if (action === 'delete-verse') {
            const ayatId = parseInt(btn.getAttribute('data-id'))
            this.confirmDelete(
              'Delete Verse',
              'Are you sure you want to delete this verse? This cannot be undone.',
              () => this.deleteVerse(ayatId)
            )
          } else if (action === 'new-verse') {
            const suraId = parseInt(btn.getAttribute('data-sura-id'))
            this.editVerse(null, suraId)
          } else if (action === 'edit-tafsir') {
            const id = parseInt(btn.getAttribute('data-id'))
            await this.editTafsir(id)
          } else if (action === 'delete-tafsir') {
            const id = parseInt(btn.getAttribute('data-id'))
            this.confirmDelete(
              'Delete Tafsir',
              'Are you sure you want to delete this tafsir section? This cannot be undone.',
              () => this.deleteTafsir(id)
            )
          } else if (action === 'create-tafsir') {
            const suraId = parseInt(btn.getAttribute('data-sura-id'))
            await this.createTafsirForSurah(suraId)
          } else if (action === 'new-tafsir') {
            await this.resetTafsirForm()
            this.showView('tafsir-form')
            location.hash = 'tafsir-form'
          }
        })

        // Hash routing
        window.addEventListener('hashchange', () => this.route())
      },

      /**
       * Route based on URL hash
       */
      async route() {
        const hash = location.hash.replace('#', '') || ''

        // Gate every view behind login
        if (localStorage.getItem('logged_in') !== '1') {
          if (hash) location.hash = ''
          this.showView('login')
          return
        }

        if (hash.startsWith('surah/')) {
          const id = parseInt(hash.split('/')[1])
          if (id) this.showSurahDetail(id)
        } else if (hash === 'tafsir') {
          this.showView('tafsir')
          await this.loadTafsir()
        } else if (hash === 'tafsir/new') {
          this.showView('tafsir-form')
          await this.resetTafsirForm()
        } else if (hash.startsWith('tafsir/edit/')) {
          const id = parseInt(hash.split('/')[2])
          this.showView('tafsir-form')
          await this.loadTafsirForm(id)
        } else if (hash === 'verse-form') {
          this.showView('verse-form')
        } else if (hash === 'tafsir-form') {
          this.showView('tafsir-form')
        } else if (hash === '') {
          this.showView('surahs')
          this.loadSurahs()
        }
      },

      /**
       * Navigate to a specific view
       */
      navigate(view) {
        const viewMap = {
          surahs: '',
          tafsir: 'tafsir',
          'verse-form': 'verse-form',
          'tafsir-form': 'tafsir-form'
        }
        location.hash = viewMap[view] || ''
        this.currentView = view
        if (view === 'surahs') this.loadSurahs()
        else if (view === 'tafsir') this.loadTafsir()
      },

      /**
       * Show a specific view
       */
      showView(name) {
        const views = ['login', 'surahs', 'surah-detail', 'tafsir', 'tafsir-form', 'verse-form']
        views.forEach(id => {
          const el = document.getElementById(id + '-view')
          if (el) el.style.display = id === name ? 'block' : 'none'
        })
        const header = document.getElementById('app-header')
        if (header) header.style.display = name !== 'login' ? 'block' : 'none'
        // Nav active states
        const navSurahs = document.getElementById('nav-surahs')
        const navTafsir = document.getElementById('nav-tafsir')
        if (navSurahs && navTafsir) {
          navSurahs.classList.toggle('active', name === 'surahs' || name === 'surah-detail' || name === 'verse-form')
          navTafsir.classList.toggle('active', name === 'tafsir' || name === 'tafsir-form')
        }
        this.currentView = name
      },

      /**
       * Show toast notification
       */
      alerts(msg, category = 'error') {
        const el = document.getElementById('alerts')
        if (!el) return
        const icons = { success: '✅', error: '⚠️', info: 'ℹ️' }
        const toast = document.createElement('div')
        toast.className = `toast toast-${category}`
        toast.innerHTML = `<span>${icons[category] || 'ℹ️'}</span><span>${msg}</span>`
        el.appendChild(toast)
        setTimeout(() => {
          toast.classList.add('hide')
          setTimeout(() => toast.remove(), 260)
        }, 3200)
      },

      /**
       * Open the confirm modal
       */
      confirmDelete(title, message, callback) {
        document.getElementById('confirm-title').textContent = title
        document.getElementById('confirm-message').textContent = message
        this._confirmCallback = callback
        document.getElementById('confirm-modal').classList.add('show')
        document.getElementById('confirm-ok').focus()
      },

      closeConfirm() {
        document.getElementById('confirm-modal').classList.remove('show')
        this._confirmCallback = null
      },

      /**
       * Handle login
       */
      async login() {
        const pw = document.getElementById('login-password')?.value
        if (!pw) {
          this.alerts('Please enter password', 'error')
          return
        }

        if (pw === CONFIG.ADMIN_PASSWORD) {
          localStorage.setItem('logged_in', '1')
          this.showView('surahs')
          this.loadSurahs()
          this.alerts('Welcome back', 'success')
        } else {
          this.alerts('Incorrect password', 'error')
        }
      },

      /**
       * Handle logout
       */
      logout() {
        localStorage.removeItem('logged_in')
        this.showView('login')
        location.hash = ''
      },

      /**
       * Load surahs from Supabase
       */
      async loadSurahs() {
        const grid = document.getElementById('surahs-grid')
        if (!grid) return

        grid.innerHTML = '<div class="loading"><span class="spinner"></span> Loading surahs</div>'

        try {
          const { data, error } = await db.from('surahs').select('*').order('sura_id')
          if (error) throw error
          this.surahs = data || []
          const chip = document.getElementById('surah-count-chip')
          if (chip) chip.textContent = this.surahs.length
          this.renderSurahs()
        } catch (err) {
          grid.innerHTML = `<div class="empty-state">
            <div class="empty-icon">📚</div>
            <h3>Loading error</h3>
            <p>Unable to load data. Check your connection.</p>
          </div>`
          console.error('Load surahs error:', err)
        }
      },

      /**
       * Render surahs list with search filter
       */
      renderSurahs() {
        const grid = document.getElementById('surahs-grid')
        const q = (document.getElementById('surah-search')?.value || '').toLowerCase()

        const filtered = this.surahs.filter(s =>
          !q ||
          s.name_french?.toLowerCase().includes(q) ||
          s.name_ar?.includes(q) ||
          String(s.sura_id).includes(q)
        )

        if (!filtered.length) {
          grid.innerHTML = `<div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>No surahs found</h3>
            <p>No results for "${q}"</p>
          </div>`
          return
        }

        grid.innerHTML = filtered.map(s => `
          <div class="card surah-card" data-sura-id="${s.sura_id}">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.75rem;">
              <div style="display: flex; align-items: center; gap: 0.75rem; min-width: 0;">
                <div class="surah-num">${s.sura_id}</div>
                <div style="min-width: 0;">
                  <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">${s.name_french}</h3>
                  <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.3rem; flex-wrap: wrap;">
                    <span class="badge ${s.type === 'Meccan' ? 'badge-meccan' : 'badge-medinan'}">${s.type}</span>
                    <span class="badge badge-neutral">${s.ayat_count} verses</span>
                  </div>
                </div>
              </div>
              <button class="btn btn-sm btn-primary" data-action="open-surah" data-id="${s.sura_id}"><i class="bi bi-eye"></i> View</button>
            </div>
            <div class="arabic arabic-name">${s.name_ar}</div>
          </div>
        `).join('')
      },

      /**
       * Show surah detail page
       */
      async showSurahDetail(suraId) {
        this.showView('surah-detail')
        const container = document.getElementById('surah-detail-content')
        if (!container) return

        container.innerHTML = '<p class="loading"><span class="spinner"></span> Loading...</p>'

        try {
          const [{ data: surah }, { data: verses }, { data: tafsir }] = await Promise.all([
            db.from('surahs').select('*').eq('sura_id', suraId).single(),
            db.from('verses').select('*').eq('sura_id', suraId).order('ayat_no'),
            db.from('tafsir_content').select('id,section_id,content,tafsir_sections(title_fr)').eq('sura_id', suraId).order('section_id')
          ])

          if (!surah) {
            container.innerHTML = '<div class="empty-state"><h3>Surah not found</h3></div>'
            return
          }

          this.verses = verses || []
          this.verseSuraId = suraId

          container.innerHTML = `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap;">
                <div style="min-width: 0;">
                  <div class="arabic" style="font-size: 1.7rem; color: var(--color-accent); line-height: 1.4;">${surah.name_ar}</div>
                  <h2 style="margin: 0.35rem 0 0.5rem; font-size: 1.4rem; font-weight: 600;">${surah.name_french}</h2>
                  <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                    <span class="badge ${surah.type === 'Meccan' ? 'badge-meccan' : 'badge-medinan'}">${surah.type}</span>
                    <span class="badge badge-neutral">${this.verses.length} verses</span>
                    <span class="badge badge-gold">Surah ${suraId}</span>
                  </div>
                </div>
                <button class="btn btn-secondary btn-sm" data-action="new-verse" data-sura-id="${suraId}">
                  <i class="bi bi-plus-lg"></i> New Verse
                </button>
              </div>
            </div>

            <h3 style="font-weight: 600; margin: 1.25rem 0 0.75rem;">Verses <span class="count-chip" style="font-size:0.72rem; background: var(--color-bg-card-hover); color: var(--color-text-muted); padding: 0.15rem 0.6rem; border-radius: 999px;">${this.verses.length}</span></h3>
            <div id="verses-list">
              ${this.renderVersesList()}
            </div>

            <div style="display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin: 1.75rem 0 0.75rem; flex-wrap: wrap;">
              <h3 style="font-weight: 600; margin: 0;">Tafsir Sections <span class="count-chip" style="font-size:0.72rem; background: var(--color-bg-card-hover); color: var(--color-text-muted); padding: 0.15rem 0.6rem; border-radius: 999px;">${tafsir?.length || 0}</span></h3>
              <button class="btn btn-primary btn-sm" data-action="create-tafsir" data-sura-id="${suraId}">
                <i class="bi bi-plus-lg"></i> Add Tafsir
              </button>
            </div>
            ${tafsir && tafsir.length ? this.renderTafsirCards(tafsir) : '<div class="card flat"><div class="empty-state" style="padding: 1.5rem;"><div class="empty-icon">📝</div><h3>No tafsir yet</h3><p>Add the first tafsir section for this surah.</p></div></div>'}
          `
        } catch (err) {
          container.innerHTML = `<div class="alert alert-error">Error: ${err.message}</div>`
          console.error('Show surah detail error:', err)
        }
      },

      /**
       * Render verses list as accordion
       */
      renderVersesList() {
        if (!this.verses?.length) {
          return '<div class="card flat"><div class="empty-state" style="padding: 1.5rem;"><div class="empty-icon">🕌</div><h3>No verses yet</h3><p>Add the first verse with the New Verse button.</p></div></div>'
        }

        return this.verses.map(v => `
          <div class="accordion">
            <button class="accordion-header" type="button" data-action="toggle-accordion" aria-expanded="false">
              <span style="display: flex; align-items: center; gap: 0.6rem; min-width: 0;">
                <span class="verse-chip">${v.ayat_no}</span>
                <span>${v.ayat_fr ? v.ayat_fr.substring(0, 60) + (v.ayat_fr.length > 60 ? '…' : '') : 'Verse ' + v.ayat_no}</span>
                ${v.juz_no ? `<span class="badge badge-neutral">Juz ${v.juz_no}</span>` : ''}
              </span>
              <i class="bi bi-chevron-down"></i>
            </button>
            <div class="accordion-body" id="verse-${v.ayat_id}">
              <p class="arabic verse-text" style="margin: 0.25rem 0 0.6rem;">${v.ayat_ar || '<em style="opacity:0.5">No Arabic text</em>'}</p>
              <p class="translation-text" style="margin: 0 0 0.75rem;">${v.ayat_fr || '<em>No translation</em>'}</p>
              ${v.audio_url ? `<div style="margin-bottom: 0.6rem;"><a class="btn btn-sm btn-secondary" href="${v.audio_url}" target="_blank" rel="noopener"><i class="bi bi-play-circle"></i> Audio</a></div>` : ''}
              <div class="section-actions">
                <button class="icon-btn edit" title="Edit" data-action="edit-verse" data-id="${v.ayat_id}"><i class="bi bi-pencil"></i></button>
                <button class="icon-btn del" title="Delete" data-action="delete-verse" data-id="${v.ayat_id}"><i class="bi bi-trash"></i></button>
              </div>
            </div>
          </div>
        `).join('')
      },

      /**
       * Render tafsir cards
       */
      renderTafsirCards(entries) {
        return `<div class="grid grid-2">${entries.map(t => `
          <div class="card tafsir-section-card saved" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem;">
              <strong style="font-size: 0.95rem; color: var(--color-accent);">${t.tafsir_sections?.title_fr || 'Section ' + t.section_id}</strong>
              <div class="section-actions">
                <button class="icon-btn edit" title="Edit" data-action="edit-tafsir" data-id="${t.id}"><i class="bi bi-pencil"></i></button>
                <button class="icon-btn del" title="Delete" data-action="delete-tafsir" data-id="${t.id}"><i class="bi bi-trash"></i></button>
              </div>
            </div>
            <div class="content-preview" style="margin-top: 0.6rem; -webkit-line-clamp: 4;">${t.content.replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim().substring(0, 220)}${t.content.length > 220 ? '…' : ''}</div>
          </div>
        `).join('')}</div>`
      },

      /**
       * Back from verse form to the surah detail
       */
      backFromVerse() {
        if (this.verseSuraId) {
          location.hash = 'surah/' + this.verseSuraId
          this.showSurahDetail(this.verseSuraId)
        } else {
          this.navigate('surahs')
        }
      },

      /**
       * Edit or create a verse
       */
      async editVerse(ayatId, suraId = null) {
        if (suraId) {
          this.verseSuraId = suraId
          try {
            const { data: verses } = await db.from('verses').select('*').eq('sura_id', suraId).order('ayat_no')
            this.verses = verses || []
          } catch (err) {
            console.error('Error loading verses:', err)
          }
        }

        let v
        if (ayatId === null) {
          document.getElementById('verse-form-title').textContent = 'New Verse'
          document.getElementById('verse-ar').value = ''
          document.getElementById('verse-fr').value = ''
          document.getElementById('verse-audio-url').value = ''
          document.getElementById('verse-audio-fr').value = ''
          document.getElementById('verse-audio-tafsir').value = ''
          this.editingVerseId = null
        } else {
          v = this.verses.find(x => x.ayat_id === ayatId)
          if (!v) {
            this.alerts('Verse not found', 'error')
            return
          }
          document.getElementById('verse-form-title').textContent = `Edit Verse #${v.ayat_no}`
          document.getElementById('verse-ar').value = v.ayat_ar || ''
          document.getElementById('verse-fr').value = v.ayat_fr || ''
          document.getElementById('verse-audio-url').value = v.audio_url || ''
          document.getElementById('verse-audio-fr').value = v.audio_translation_french || ''
          document.getElementById('verse-audio-tafsir').value = v.audio_tafsir || ''
          this.editingVerseId = ayatId
        }
        location.hash = 'verse-form'
        this.showView('verse-form')
      },

      /**
       * Save verse changes (create or update)
       */
      async saveVerse() {
        const ar = document.getElementById('verse-ar').value.trim()
        const fr = document.getElementById('verse-fr').value.trim()
        const audioUrl = document.getElementById('verse-audio-url').value.trim()
        const audioFr = document.getElementById('verse-audio-fr').value.trim()
        const audioTafsir = document.getElementById('verse-audio-tafsir').value.trim()

        if (!ar) {
          this.alerts('Arabic text is required', 'error')
          return
        }

        try {
          if (this.editingVerseId) {
            const { error } = await db.from('verses').update({
              ayat_ar: ar,
              ayat_fr: fr,
              audio_url: audioUrl,
              audio_translation_french: audioFr,
              audio_tafsir: audioTafsir
            }).eq('ayat_id', this.editingVerseId)
            if (error) throw error
            this.alerts('Verse updated', 'success')
          } else {
            const suraId = this.verseSuraId
            if (!suraId) {
              this.alerts('Cannot determine surah for new verse', 'error')
              return
            }
            const maxAyatNo = this.verses.reduce((max, v) => Math.max(max, v.ayat_no || 0), 0)
            const { error } = await db.from('verses').insert({
              sura_id: suraId,
              ayat_no: maxAyatNo + 1,
              ayat_ar: ar,
              ayat_fr: fr,
              audio_url: audioUrl,
              audio_translation_french: audioFr,
              audio_tafsir: audioTafsir
            })
            if (error) throw error
            this.alerts('Verse created', 'success')
          }
          this.backFromVerse()
        } catch (err) {
          this.alerts(`Error: ${err.message}`, 'error')
          console.error('Save verse error:', err)
        }
      },

      /**
       * Delete a verse
       */
      async deleteVerse(ayatId) {
        try {
          const { error } = await db.from('verses').delete().eq('ayat_id', ayatId)
          if (error) throw error
          this.alerts('Verse deleted', 'success')
          if (this.verseSuraId) {
            this.showSurahDetail(this.verseSuraId)
          } else {
            this.navigate('surahs')
          }
        } catch (err) {
          this.alerts(`Error: ${err.message}`, 'error')
        }
      },

      /**
       * Edit tafsir entry (opens multi-section editor for the surah)
       */
      async editTafsir(id) {
        const token = ++this._editToken
        this.editingTafsirId = id
        await this.resetTafsirForm()
        if (token !== this._editToken) return
        try {
          const { data } = await db.from('tafsir_content').select('sura_id').eq('id', id).single()
          if (token !== this._editToken) return
          if (data) {
            document.getElementById('tafsir-form-title').textContent = 'Edit Tafsir'
            document.getElementById('tafsir-sura-id').value = data.sura_id
            await this.renderTafsirSections()
            if (token !== this._editToken) return
            this.showView('tafsir-form')
            location.hash = 'tafsir-form'
          } else {
            this.alerts('Tafsir entry not found', 'error')
            this.navigate('tafsir')
          }
        } catch (err) {
          console.error('Edit tafsir error:', err)
          this.alerts('Failed to load tafsir entry', 'error')
        }
      },

      /**
       * Load tafsir list
       */
      async loadTafsir() {
        const grid = document.getElementById('tafsir-grid')
        if (!grid) return

        grid.innerHTML = '<div class="loading"><span class="spinner"></span> Loading tafsir</div>'

        try {
          const [{ data: tafsirData }, { data: sections }] = await Promise.all([
            db.from('tafsir_content').select('id,sura_id,section_id,content,surahs(name_french,name_ar),tafsir_sections(title_fr,title_fr_short,sort_order)').order('sura_id'),
            db.from('tafsir_sections').select('id,sort_order').order('sort_order')
          ])

          if (tafsirData) {
            const sectionSort = {}
            ;(sections || []).forEach(s => { sectionSort[s.id] = s.sort_order })
            tafsirData.sort((a, b) => {
              if (a.sura_id !== b.sura_id) return a.sura_id - b.sura_id
              return (sectionSort[a.section_id] || 0) - (sectionSort[b.section_id] || 0)
            })
          }

          this.tafsirCache = tafsirData || []
          const chip = document.getElementById('tafsir-count-chip')
          if (chip) chip.textContent = this.tafsirCache.length
          this.renderTafsir()
        } catch (err) {
          grid.innerHTML = `<div class="empty-state">
            <div class="empty-icon">📚</div>
            <h3>Loading error</h3>
            <p>Check your Supabase connection.</p>
          </div>`
          console.error('Load tafsir error:', err)
        }
      },

      /**
       * Render tafsir list with search, grouped by surah
       */
      renderTafsir() {
        const grid = document.getElementById('tafsir-grid')
        const q = (document.getElementById('tafsir-search')?.value || '').toLowerCase()

        const filtered = this.tafsirCache.filter(t => {
          const name = (t.surahs?.name_french || '') + ' ' + (t.surahs?.name_ar || '') + ' ' + (t.tafsir_sections?.title_fr || '') + ' ' + (t.tafsir_sections?.title_fr_short || '') + ' ' + (t.content || '')
          return !q || name.toLowerCase().includes(q)
        })

        if (!filtered.length) {
          grid.innerHTML = `<div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>No tafsir found</h3>
            <p>${q ? `No results for "${q}"` : 'Add the first tafsir entry.'}</p>
          </div>`
          return
        }

        // Group by surah
        const grouped = []
        let current = null
        for (const t of filtered) {
          const key = t.sura_id
          if (!current || current.sura_id !== key) {
            current = { sura_id: key, name_french: t.surahs?.name_french, name_ar: t.surahs?.name_ar, entries: [] }
            grouped.push(current)
          }
          current.entries.push(t)
        }

        grid.innerHTML = grouped.map(g => `
          <div class="card" style="margin-bottom: 0;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.25rem; gap: 0.5rem;">
              <div style="min-width: 0;">
                <h3 style="margin: 0; font-size: 1.05rem; font-weight: 600;">${g.sura_id}. ${g.name_french}</h3>
                <div class="arabic" style="font-size: 0.95rem; color: var(--color-accent); margin-top: 0.15rem;">${g.name_ar || ''}</div>
              </div>
              <div style="display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;">
                <span class="badge badge-gold">${g.entries.length} section${g.entries.length > 1 ? 's' : ''}</span>
                <button class="icon-btn edit" title="Edit all sections" data-action="edit-tafsir" data-id="${g.entries[0].id}"><i class="bi bi-pencil-square"></i></button>
              </div>
            </div>
            ${g.entries.map(t => `
              <div class="tafsir-item">
                <div style="min-width: 0;">
                  <div class="section-title">${t.tafsir_sections?.title_fr_short || t.tafsir_sections?.title_fr || 'Section ' + t.section_id}</div>
                  <div class="content-preview">${t.content.replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim().substring(0, 160)}${t.content.length > 160 ? '…' : ''}</div>
                </div>
                <div class="section-actions">
                  <button class="icon-btn edit" title="Edit" data-action="edit-tafsir" data-id="${t.id}"><i class="bi bi-pencil"></i></button>
                  <button class="icon-btn del" title="Delete" data-action="delete-tafsir" data-id="${t.id}"><i class="bi bi-trash"></i></button>
                </div>
              </div>
            `).join('')}
          </div>
        `).join('') + `
          <div style="display: flex; justify-content: center;">
            <button class="btn btn-primary" data-action="new-tafsir"><i class="bi bi-plus-lg"></i> New Tafsir</button>
          </div>`
      },

      /**
       * Create new tafsir form for a surah
       */
      async createTafsirForSurah(suraId) {
        const token = ++this._editToken
        this.editingTafsirId = null
        await this.resetTafsirForm()
        if (token !== this._editToken) return
        document.getElementById('tafsir-form-title').textContent = 'New Tafsir'
        document.getElementById('tafsir-sura-id').value = suraId
        await this.renderTafsirSections()
        if (token !== this._editToken) return
        this.showView('tafsir-form')
        location.hash = 'tafsir-form'
      },

      /**
       * Reset tafsir form
       */
      async resetTafsirForm() {
        this.sectionEditors.forEach(editor => {
          if (editor && typeof editor.destroy === 'function') {
            try { editor.destroy() } catch (e) { /* already disposed */ }
          }
        })
        this.sectionEditors = new Map()
        document.getElementById('tafsir-form-title').textContent = 'Tafsir Editor'
        document.getElementById('tafsir-sura-id').value = ''
        document.getElementById('tafsir-sections-container').innerHTML = ''
        document.getElementById('surah-info-bar').style.display = 'none'
        document.getElementById('section-progress-bar').style.display = 'none'
        await this.populateTafsirSelects()
      },

      /**
       * Populate select dropdowns
       */
      async populateTafsirSelects() {
        try {
          const [{ data: surahs }, { data: sections }] = await Promise.all([
            db.from('surahs').select('sura_id,name_french,name_ar').order('sura_id'),
            db.from('tafsir_sections').select('id,title_fr,title_fr_short,sort_order').order('sort_order')
          ])

          document.getElementById('tafsir-sura-id').innerHTML =
            '<option value="">-- Choose a surah --</option>' +
            (surahs || []).map(s =>
              `<option value="${s.sura_id}">${s.sura_id} - ${s.name_french} ${s.name_ar || ''}</option>`
            ).join('')

          this.allSections = sections || []
        } catch (err) {
          console.error('Populate selects error:', err)
        }
      },

      /**
       * Render tafsir sections for selected surah
       */
      async renderTafsirSections() {
        const run = async () => {
          const prev = this._renderPromise
          if (prev) { try { await prev } catch (e) { /* chain continues */ } }
          const suraId = parseInt(document.getElementById('tafsir-sura-id').value)
          const container = document.getElementById('tafsir-sections-container')
          if (!suraId || isNaN(suraId) || !container) {
            if (container) container.innerHTML = ''
            return
          }

        try {
          const infoBar = document.getElementById('surah-info-bar')
          if (infoBar) {
            const surah = this.surahs.find(s => s.sura_id === suraId)
            infoBar.innerHTML = `<i class="bi bi-info-circle"></i> Editing <strong>${suraId}. ${surah?.name_french || ''}</strong> <span class="arabic" style="color: var(--color-accent);">${surah?.name_ar || ''}</span> — saving each section individually is recommended`
            infoBar.style.display = 'block'
          }

          const [{ data: existing }] = await Promise.all([
            db.from('tafsir_content').select('section_id,content').eq('sura_id', suraId)
          ])

          const existingMap = {}
          ;(existing || []).forEach(e => { existingMap[e.section_id] = e.content })

          container.innerHTML = (this.allSections || []).map(section => {
            const sectionContent = existingMap[section.id] || ''
            const hasContent = !!sectionContent
            return `
              <div class="card tafsir-section-card ${hasContent ? 'saved' : 'empty'}" data-section-id="${section.id}" style="margin-bottom: 1rem;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem; gap: 0.5rem; flex-wrap: wrap;">
                  <div style="flex: 1; min-width: 200px;">
                    <strong style="font-size: 0.95rem;">${section.title_fr}</strong>
                    <span class="save-status ${hasContent ? 'badge-success' : 'badge-info'}" style="margin-left: 0.5rem;">${hasContent ? '✓ Saved' : 'Empty'}</span>
                  </div>
                  <button type="button" class="btn btn-sm btn-primary save-section-btn" data-section-id="${section.id}" style="white-space: nowrap;"><i class="bi bi-check-lg"></i> Save</button>
                </div>
                <div class="wysiwyg-wrapper">
                  <div class="ql-editor-section ql-editor" dir="rtl" data-section-id="${section.id}">${sectionContent}</div>
                </div>
              </div>
            `
          }).join('')

          // Dispose old editors
          this.sectionEditors.forEach(editor => {
            if (editor && typeof editor.off === 'function') {
              editor.off('text-change')
            }
            if (editor && typeof editor.destroy === 'function') {
              try { editor.destroy() } catch (e) { /* already disposed */ }
            }
          })
          this.sectionEditors = new Map()

          // Create new Quill editors
          const editors = container.querySelectorAll('.ql-editor-section')
          editors.forEach(el => {
            const sectionId = parseInt(el.getAttribute('data-section-id'))
            const editor = new Quill(el, {
              theme: 'snow',
              placeholder: 'Enter tafsir content...',
              modules: {
                toolbar: [
                  [{ header: [1, 2, 3, false] }],
                  ['bold', 'italic', 'underline', 'strike'],
                  [{ color: [] }, { background: [] }],
                  [{ list: 'ordered' }, { list: 'bullet' }],
                  [{ indent: '-1' }, { indent: '+1' }],
                  [{ direction: 'rtl' }],
                  [{ align: [] }],
                  ['link', 'image', 'video'],
                  ['clean']
                ]
              }
            })
            const sectionContent = existingMap[sectionId] || ''
            if (sectionContent) editor.root.innerHTML = sectionContent
            this.sectionEditors.set(sectionId, editor)
          })

          // Progress bar
          const filledCount = Object.values(existingMap).filter(Boolean).length
          const total = this.allSections?.length || 0
          const progEl = document.getElementById('section-progress-bar')
          if (progEl && total > 0) {
            let dots = ''
            for (let i = 0; i < total; i++) {
              const sec = this.allSections[i]
              dots += '<span class="dot' + (existingMap[sec.id] ? ' filled' : '') + '"></span>'
            }
            progEl.style.display = 'block'
            progEl.innerHTML = `<span style="font-weight:600; color: var(--color-text);">Progress:</span> ${filledCount}/${total} sections filled <span style="display:inline-flex;align-items:center;gap:0.25rem;margin-left:0.5rem;">${dots}</span>`
          } else if (progEl) {
            progEl.style.display = 'none'
          }

          // Wire per-section save buttons
          container.querySelectorAll('.save-section-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const sectionId = parseInt(btn.getAttribute('data-section-id'))
              btn.classList.add('saving')
              btn.disabled = true
              btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px;"></span>'
              try {
                const ok = await this.saveTafsirSection(suraId, sectionId)
                btn.classList.remove('saving')
                btn.disabled = false
                if (ok) {
                  btn.classList.add('saved')
                  btn.innerHTML = '<i class="bi bi-check-lg"></i> Saved'
                  const card = btn.closest('.tafsir-section-card')
                  if (card) { card.classList.add('saved'); card.classList.remove('empty') }
                  setTimeout(() => {
                    btn.classList.remove('saved')
                    btn.innerHTML = '<i class="bi bi-check-lg"></i> Save'
                  }, 2500)
                } else {
                  btn.innerHTML = '<i class="bi bi-check-lg"></i> Save'
                }
              } catch (err) {
                btn.classList.remove('saving')
                btn.disabled = false
                btn.innerHTML = '<i class="bi bi-check-lg"></i> Save'
              }
            })
          })
        } catch (err) {
          console.error('Render sections error:', err)
        }
        };
        this._renderPromise = run()
        try {
          await this._renderPromise
        } finally {
          this._renderPromise = null
        }
      },

      /**
       * Save a single tafsir section (create or update). Returns true on success.
       */
      async saveTafsirSection(suraId, sectionId) {
        const editor = this.sectionEditors?.get(sectionId)
        const content = editor ? editor.root.innerHTML.trim() : ''
        const isBlank = content === '' || content === '<p><br></p>' || content === '<p><br/></p>'

        if (isBlank) {
          this.alerts('Content is required', 'error')
          return false
        }

        try {
          const { data: existing } = await db.from('tafsir_content')
            .select('id')
            .eq('sura_id', suraId)
            .eq('section_id', sectionId)
            .maybeSingle()

          if (existing) {
            const { error } = await db.from('tafsir_content')
              .update({ content })
              .eq('id', existing.id)
            if (error) throw error
            this.alerts('Section saved', 'success')
          } else {
            const { error } = await db.from('tafsir_content')
              .insert({ sura_id: suraId, section_id: sectionId, content })
            if (error) throw error
            this.alerts('Section created', 'success')
          }
          return true
        } catch (err) {
          this.alerts(`Error: ${err.message}`, 'error')
          console.error('Save section error:', err)
          return false
        }
      },

      /**
       * Save all non-empty tafsir sections
       */
      async saveAllTafsir() {
        const suraId = parseInt(document.getElementById('tafsir-sura-id').value)
        if (!suraId) {
          this.alerts('Please select a surah', 'error')
          return
        }

        const editors = this.sectionEditors || new Map()
        let saved = 0
        let failed = 0
        for (const [sectionId, editor] of editors) {
          const content = editor.root.innerHTML.trim()
          const isBlank = content === '' || content === '<p><br></p>' || content === '<p><br/></p>'
          if (isBlank) continue
          const ok = await this.saveTafsirSection(suraId, sectionId)
          if (ok) saved++
          else failed++
        }
        if (saved > 0) {
          this.alerts(`${saved} section${saved > 1 ? 's' : ''} saved${failed ? `, ${failed} failed` : ''}`, failed ? 'error' : 'success')
          if (!failed) {
            location.hash = 'surah/' + suraId
            this.showSurahDetail(suraId)
          }
        } else if (failed === 0) {
          this.alerts('Nothing to save — all sections are empty', 'info')
        }
      },

      /**
       * Load tafsir form for editing (by id)
       */
      async loadTafsirForm(id) {
        const token = ++this._editToken
        this.editingTafsirId = id
        await this.resetTafsirForm()
        if (token !== this._editToken) return
        try {
          const { data } = await db.from('tafsir_content').select('sura_id').eq('id', id).single()
          if (token !== this._editToken) return
          if (!data) {
            this.alerts('Entry not found', 'error')
            this.navigate('tafsir')
            return
          }

          document.getElementById('tafsir-form-title').textContent = 'Edit Tafsir'
          document.getElementById('tafsir-sura-id').value = data.sura_id
          await this.renderTafsirSections()
        } catch (err) {
          if (token === this._editToken) this.alerts(`Error: ${err.message}`, 'error')
        }
      },

      /**
       * Delete tafsir entry
       */
      async deleteTafsir(id) {
        try {
          const { error } = await db.from('tafsir_content').delete().eq('id', id)
          if (error) throw error
          this.alerts('Tafsir deleted', 'success')
          const hash = location.hash.replace('#', '')
          if (hash.startsWith('surah/')) {
            const suraId = parseInt(hash.split('/')[1])
            if (suraId) this.showSurahDetail(suraId)
          } else {
            await this.loadTafsir()
          }
        } catch (err) {
          this.alerts(`Error: ${err.message}`, 'error')
        }
      }
    }

    // Initialize app
    app.init()
  </script>

  <!-- Bootstrap Icons for UI elements -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</body>
